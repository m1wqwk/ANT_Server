spring.application.name=ant-server

spring.datasource.url=jdbc:postgresql://localhost:5432/antivirus_db
spring.datasource.username=USERNAME
spring.datasource.password=PASSWORD
jwt.secret=${JWT_SECRET:KEY}
jwt.access-token.expiration=900
jwt.refresh-token.expiration=604800

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.com.antivirus.server=DEBUG
logging.level.com.antivirus.server.service.TokenService=DEBUG
logging.level.org.springframework.orm.jpa=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

ticket.secret=KEY
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=CERTIFICATE
server.ssl.key-store-type=JKS
server.ssl.key-store-password=PASSWORD
server.ssl.key-alias=KEY

signature.key-store-path=classpath:signing.jks
signature.key-store-type=JKS
signature.key-store-password=${SIGNING_KEYSTORE_PASSWORD}
signature.key-alias=${SIGNING_KEY_ALIAS}
signature.key-password=${SIGNING_KEYSTORE_PASSWORD}


minio.url=http://localhost:9000
minio.access-key=${MINIO_APP_USER}
minio.secret-key=${MINIO_APP_PASSWORD}
minio.bucket=signatures